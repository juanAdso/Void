name: Calidad y pruebas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calidad:
    name: Validar formato, compilación y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml, curl, zip
          coverage: none

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verificar formato PHP con Laravel Pint
        run: composer format:check

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Aplicar formato Prettier a los archivos del proyecto
        run: npm run format:frontend

      - name: Guardar el formato de las vistas modificadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/facturas/create.blade.php resources/views/facturas/index.blade.php resources/views/facturas/show.blade.php resources/views/layouts/publico.blade.php resources/views/welcome.blade.php
          if ! git diff --cached --quiet; then
            git commit -m "Aplica formato Prettier a las vistas VOID"
            git push origin HEAD:main
          fi

      - name: Verificar formato de vistas y recursos frontend
        run: npm run format:frontend:check

      - name: Compilar frontend
        run: npm run build

      - name: Preparar entorno de pruebas
        run: touch .env

      - name: Ejecutar pruebas automatizadas
        run: php artisan test

      - name: Comprobar espacios y errores de diff
        run: git diff --check
