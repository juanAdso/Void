name: Calidad y pruebas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    name: Validar formato, compilación y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml, curl, zip
          coverage: none

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verificar formato PHP con Laravel Pint
        run: composer format:check

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Verificar formato de vistas y recursos frontend
        run: npm run format:frontend:check

      - name: Compilar frontend
        run: npm run build

      - name: Preparar entorno de pruebas
        run: touch .env

      - name: Ejecutar pruebas automatizadas
        run: php artisan test

      - name: Comprobar espacios y errores de diff
        run: git diff --check
