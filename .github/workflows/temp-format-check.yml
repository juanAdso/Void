name: Formato y validación temporal

on:
  push:
    branches:
      - temp/void-datatables-final

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml, curl, zip
          coverage: none

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verificar formato PHP
        run: composer format:check

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Aplicar formato Prettier
        run: npm run format:frontend

      - name: Guardar formato en la rama temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views resources/css resources/js .github/workflows composer.json README.md package.json
          if ! git diff --cached --quiet; then
            git commit -m "Formatear integración DataTables"
            git push origin HEAD:temp/void-datatables-final
          fi

      - name: Verificar formato frontend
        run: npm run format:frontend:check

      - name: Compilar frontend
        run: npm run build

      - name: Preparar entorno de pruebas
        run: touch .env

      - name: Ejecutar pruebas automatizadas
        run: php artisan test
