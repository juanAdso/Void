name: Formateo temporal de vistas de facturas

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/formateo-temporal-facturas.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm ci
      - name: Aplicar Prettier y exportar vistas
        run: |
          npx prettier --write resources/views/facturas/create.blade.php resources/views/facturas/index.blade.php resources/views/facturas/show.blade.php
          for file in resources/views/facturas/create.blade.php resources/views/facturas/index.blade.php resources/views/facturas/show.blade.php; do
            echo "BEGIN_BASE64:$file"
            base64 -w 0 "$file"
            echo
            echo "END_BASE64:$file"
          done
