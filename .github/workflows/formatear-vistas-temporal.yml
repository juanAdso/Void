name: Formatear vistas Blade temporal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatear:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Formatear las vistas Blade
        run: |
          npx prettier --write \
            resources/views/categoria/index.blade.php \
            resources/views/clientes/index.blade.php \
            resources/views/dashboard/admin.blade.php \
            resources/views/dashboard/empleado.blade.php \
            resources/views/facturas/create.blade.php \
            resources/views/facturas/index.blade.php \
            resources/views/facturas/show.blade.php \
            resources/views/productos/index.blade.php \
            resources/views/tiendas/index.blade.php

      - name: Exportar vistas formateadas
        uses: actions/upload-artifact@v4
        with:
          name: void-blade-prettier
          path: |
            resources/views/categoria/index.blade.php
            resources/views/clientes/index.blade.php
            resources/views/dashboard/admin.blade.php
            resources/views/dashboard/empleado.blade.php
            resources/views/facturas/create.blade.php
            resources/views/facturas/index.blade.php
            resources/views/facturas/show.blade.php
            resources/views/productos/index.blade.php
            resources/views/tiendas/index.blade.php
          if-no-files-found: error
          retention-days: 1
